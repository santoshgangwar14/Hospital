<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital</title><style>
:root{--p:#0b6e99;--s:#e8f4f8;--bg:#f6f8fa;--tx:#1c2b33;--ln:#d5dde3;--ok:#1a7f4b;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--p);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}header img{height:36px;background:#fff;border-radius:6px;padding:2px}
header h1{font-size:18px;margin:0}header .sp{flex:1}header button{background:#ffffff33;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--ln)}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}nav button.on{background:var(--s);color:var(--p);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px}h3{margin:12px 0 6px;font-size:15px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:#5b6b75;gap:3px}input,select,textarea,button.b{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px}
button.b{background:var(--p);color:#fff;border:0;cursor:pointer;font-weight:600}button.b.g{background:#eef2f5;color:var(--tx);border:1px solid var(--ln)}button.b.s{padding:4px 8px;font-size:12px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}th{font-size:12px;color:#5b6b75}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp div{background:var(--s);border-radius:10px;padding:12px}.kp b{display:block;font-size:22px}
.msg{padding:8px 12px;border-radius:8px;margin-bottom:10px;background:#fdecea;color:var(--bad)}.msg.ok{background:#e6f4ec;color:var(--ok)}.sc{overflow-x:auto}
.tag{padding:2px 8px;border-radius:99px;background:var(--s);font-size:12px}#login{max-width:360px;margin:60px auto}
</style></head><body><div id="app"></div><script>
const q=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const T=new URLSearchParams(location.search).get('t')||localStorage.getItem('hms_t')||'';if(T)localStorage.setItem('hms_t',T);
let S={cfg:null,user:null,view:'dash',sel:null,msg:'',ok:false,doctors:[],tariff:[]};
async function api(p,o={}){const h={'Content-Type':'application/json'};if(T)h['X-Tenant']=T;const k=sessionStorage.getItem('hms_tok');if(k)h.Authorization='Bearer '+k;
const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});let j=null;try{j=await r.json()}catch(e){}
if(!r.ok){const m=j&&j.detail?(Array.isArray(j.detail)?j.detail.map(x=>x.loc[x.loc.length-1]+': '+x.msg).join(', '):j.detail):r.statusText;const e=new Error(m);e.status=r.status;throw e}return j}
const money=x=>'₹'+Number(x||0).toFixed(2),today=()=>new Date().toLocaleDateString('en-CA');
function note(m,ok){S.msg=m;S.ok=!!ok}function flash(){return S.msg?`<div class="msg ${S.ok?'ok':''}" role="alert">${esc(S.msg)}</div>`:''}
function applyBrand(){const b=S.cfg.branding;document.documentElement.style.setProperty('--p',b.primary);document.documentElement.style.setProperty('--s',b.secondary);document.title=b.name}
const TABS=[['dash','Dashboard','dashboard'],['pat','Patients','patients'],['appt','Appointments','appointments'],['ipd','IPD','ipd'],['bill','Billing','opd_billing'],['doc','Doctor desk','prescriptions'],['setup','Setup','users']];
const can=(v)=>{const r=S.user.role,m=S.cfg.modules;if(v==='doc')return m.includes('prescriptions')&&['doctor','admin'].includes(r);if(v==='setup')return r==='admin';if(v==='bill')return m.includes('opd_billing')&&r!=='doctor';
const mod=TABS.find(t=>t[0]===v)[2];return m.includes(mod)}
async function boot(){try{S.cfg=await api('/config');applyBrand()}catch(e){q('#app').innerHTML=`<div class="card" id="login"><h2>Hospital login</h2>${flash()}<p>${esc(e.message)}</p><form data-form="tenant"><label>Hospital code<input name="t" required></label><br><button class="b">Continue</button></form></div>`;note(e.message);return}
if(sessionStorage.getItem('hms_tok')){try{S.user=JSON.parse(sessionStorage.getItem('hms_user'));await load();return}catch(e){}}loginView()}
function loginView(){const b=S.cfg.branding;q('#app').innerHTML=`<div class="card" id="login">${b.logo_url?`<img src="${esc(b.logo_url)}" alt="" style="height:48px">`:''}<h2>${esc(b.name)}</h2><p>${esc(b.tagline||'')}</p>${flash()}<form data-form="login"><label>Username<input name="username" required autocomplete="username"></label><br><label>Password<input name="password" type="password" required autocomplete="current-password"></label><br><button class="b">Log in</button></form></div>`}
async function load(){S.doctors=can('appt')||can('doc')||S.user.role==='admin'?await api('/doctors').catch(()=>[]):[];S.tariff=can('bill')?await api('/tariff').catch(()=>[]):[];shell();await go(S.view)}
function shell(){const b=S.cfg.branding;q('#app').innerHTML=`<header>${b.logo_url?`<img src="${esc(b.logo_url)}" alt="">`:''}<h1>${esc(b.name)}</h1><span class="sp"></span><span>${esc(S.user.name)} (${esc(S.user.role)})</span><button data-act="logout">Log out</button></header><nav>${TABS.filter(t=>can(t[0])).map(t=>`<button data-act="nav" data-v="${t[0]}" class="${S.view===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav><main id="main"></main>`}
async function go(v){S.view=v;shell();const m=q('#main');try{m.innerHTML=flash()+await V[v]()}catch(e){m.innerHTML=`<div class="msg">${esc(e.message)}</div>`}S.msg='';if(V[v+'_after'])V[v+'_after']()}
const V={};
V.dash=async()=>{const d=await api('/dashboard');return `<div class="card"><h2>Today, ${esc(d.date)}</h2><div class="kp"><div><b>${d.appointments_total}</b>Appointments</div><div><b>${d.new_patients}</b>New patients</div><div><b>${money(d.collection_today)}</b>Collection</div><div><b>${d.appointments_by_status.waiting||0}</b>Waiting</div><div><b>${d.appointments_by_status.done||0}</b>Done</div></div></div>`};
V.pat=async()=>{const r=await api('/patients?q='+encodeURIComponent(S.q||''));return `<div class="card"><h2>Patients</h2><form class="row" data-form="psearch"><label>Search name, mobile or UHID<input name="q" value="${esc(S.q||'')}"></label><button class="b">Search</button></form><div class="sc"><table><tr><th>UHID</th><th>Name</th><th>Mobile</th><th>Gender</th><th></th></tr>${r.map(p=>`<tr><td>${esc(p.uhid)}</td><td>${esc(p.name)}</td><td>${esc(p.mobile)}</td><td>${esc(p.gender)}</td><td><button class="b g s" data-act="pick" data-id="${p.id}" data-n="${esc(p.name)} (${esc(p.uhid)})" data-to="appt">Book</button> <button class="b g s" data-act="pick" data-id="${p.id}" data-n="${esc(p.name)} (${esc(p.uhid)})" data-to="bill">Bill</button> <button class="b g s" data-act="history" data-id="${p.id}">History</button></td></tr>`).join('')||'<tr><td colspan=5>No patients</td></tr>'}</table></div></div>
<div class="card"><h2>Register new patient</h2><form class="row" data-form="padd"><label>Name<input name="name" required></label><label>Mobile (10 digits)<input name="mobile" pattern="\\d{10}" required></label><label>Gender<select name="gender"><option value=""></option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Date of birth<input type="date" name="dob"></label><label>Address<input name="address"></label><button class="b">Register</button></form></div><div id="hist"></div>`};
V.appt=async()=>{const d=S.day||today(),l=await api('/appointments?day='+d+(S.fdoc?'&doctor_id='+S.fdoc:''));const dopt=S.doctors.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
return `<div class="card"><h2>Appointments</h2><form class="row" data-form="afilter"><label>Date<input type="date" name="day" value="${d}"></label><label>Doctor<select name="doc"><option value="">All</option>${S.doctors.map(x=>`<option value="${x.id}" ${S.fdoc===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><button class="b g">Show</button></form>
<div class="sc"><table><tr><th>Token</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th></th></tr>${l.map(a=>`<tr><td>${a.token_no||'-'}</td><td>${esc((a.appt_time||'').slice(0,5))}</td><td>${esc(a.patient_name||'')} <small>${esc(a.uhid||a.mobile||'')}</small></td><td>${esc(a.doctor_name)}</td><td><span class="tag">${esc(a.status)}</span> <small>${esc(a.source)}</small></td><td>${a.status==='requested'?`<button class="b s" data-act="confirmreq" data-id="${a.id}" data-n="${esc(a.patient_name)}" data-m="${esc(a.mobile)}">Register and confirm</button> `:['booked','requested'].includes(a.status)?`<button class="b g s" data-act="st" data-id="${a.id}" data-s="waiting">Arrived</button> `:''}${['waiting'].includes(a.status)?`<button class="b g s" data-act="st" data-id="${a.id}" data-s="in_consultation">Call in</button> `:''}${['in_consultation'].includes(a.status)?`<button class="b g s" data-act="st" data-id="${a.id}" data-s="done">Done</button> `:''}${!['done','cancelled'].includes(a.status)?`<button class="b g s" data-act="st" data-id="${a.id}" data-s="cancelled">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6>No appointments</td></tr>'}</table></div></div>
<div class="card"><h2>Book appointment</h2><p>Patient: <b>${esc(S.selName||'none selected (use Patients, then Book)')}</b></p><form class="row" data-form="abook"><label>Doctor<select name="doctor_id" id="bd" required>${dopt}</select></label><label>Date<input type="date" name="appt_date" id="bdt" value="${d}" required></label><label>Slot<select name="appt_time" id="bt"><option value="">Walk-in (token only)</option></select></label><button class="b">Book</button></form></div>`};
V.appt_after=()=>{const f=async()=>{const d=q('#bd').value,y=q('#bdt').value;if(!d||!y)return;try{const r=await api(`/doctors/${d}/slots?day=${y}`);q('#bt').innerHTML='<option value="">Walk-in (token only)</option>'+r.slots.map(s=>`<option>${s}</option>`).join('')}catch(e){}};q('#bd').onchange=f;q('#bdt').onchange=f;f()};
V.bill=async()=>{const l=await api('/bills?day='+(S.bday||today())),c=await api('/reports/collection?day='+(S.bday||today()));S.lines=S.lines||[];
const sub=S.lines.reduce((a,x)=>a+x.price*x.qty,0);
return `<div class="card"><h2>New OPD bill</h2><p>Patient: <b>${esc(S.selName||'none selected (use Patients, then Bill)')}</b></p><form class="row" data-form="bline"><label>Service<select name="tid">${S.tariff.map(x=>`<option value="${x.id}">${esc(x.name)} (${money(x.price)})</option>`).join('')}</select></label><label>Qty<input type="number" name="qty" value="1" min="1" style="width:70px"></label><button class="b g">Add</button></form>
<table>${S.lines.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty} x ${money(x.price)}</td><td>${money(x.price*x.qty)}</td><td><button class="b g s" data-act="rmline" data-i="${i}">Remove</button></td></tr>`).join('')}</table>
<form class="row" data-form="bsave"><label>Discount<input type="number" name="discount" value="0" min="0" step="0.01" style="width:100px"></label><label>Pay mode<select name="mode"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></label><label>Amount paid (blank = full)<input type="number" name="amount" step="0.01" min="0" style="width:130px"></label><label>Reference<input name="ref"></label><button class="b">Save bill (subtotal ${money(sub)})</button></form></div>
<div class="card"><h2>Bills on <input type="date" id="bd2" value="${S.bday||today()}"></h2><div class="kp"><div><b>${money(c.total)}</b>Total collection</div>${c.by_mode.map(m=>`<div><b>${money(m.amount)}</b>${esc(m.mode)} (${m.count})</div>`).join('')}</div><div class="sc"><table><tr><th>Bill</th><th>Patient</th><th>Total</th><th>Paid</th><th>Status</th><th></th></tr>${l.map(b=>`<tr><td>${esc(b.bill_no)}</td><td>${esc(b.patient_name)} <small>${esc(b.uhid)}</small></td><td>${money(b.total)}</td><td>${money(b.paid)}</td><td>${esc(b.status)}</td><td><button class="b g s" data-act="receipt" data-id="${b.id}">Print</button></td></tr>`).join('')||'<tr><td colspan=6>No bills</td></tr>'}</table></div></div>`};
V.bill_after=()=>{q('#bd2').onchange=e=>{S.bday=e.target.value;go('bill')}};
V.doc=async()=>{const l=await api('/appointments?day='+today());if(!S.rx)return `<div class="card"><h2>Today's queue</h2>${S.user.role==='admin'?'<p>Admin accounts cannot write prescriptions. Log in with a doctor account.</p>':''}<table><tr><th>Token</th><th>Patient</th><th>Status</th><th></th></tr>${l.filter(a=>a.patient_id).map(a=>`<tr><td>${a.token_no}</td><td>${esc(a.patient_name)} <small>${esc(a.uhid)}</small></td><td>${esc(a.status)}</td><td><button class="b s" data-act="consult" data-id="${a.id}" data-p="${a.patient_id}" data-n="${esc(a.patient_name)}">Open</button></td></tr>`).join('')||'<tr><td colspan=4>Queue is empty</td></tr>'}</table></div>`;
const p=await api('/patients/'+S.rx.p);return `<div class="card"><h2>Consultation: ${esc(p.name)} (${esc(p.uhid)})</h2><details><summary>Previous prescriptions (${p.prescriptions.length})</summary>${p.prescriptions.map(r=>`<p><b>${esc(String(r.created_at).slice(0,10))}</b> ${esc(r.diagnosis)} <button class="b g s" data-act="printrx" data-id="${r.id}">Print</button></p>`).join('')}</details>
<form data-form="rx"><label>Complaints<textarea name="complaints" rows="2"></textarea></label><br><label>Diagnosis<input name="diagnosis"></label><br><h3>Medicines</h3><div id="meds">${[0,1,2].map(()=>medRow()).join('')}</div><button type="button" class="b g s" data-act="addmed">Add medicine</button><br><br><label>Advice<textarea name="advice" rows="2"></textarea></label><br><label>Follow-up date<input type="date" name="follow_up_date"></label><br><button class="b">Save and print</button> <button type="button" class="b g" data-act="rxback">Back</button></form></div>`};
const medRow=()=>`<div class="row med" style="margin-bottom:6px"><label>Medicine<input data-k="name"></label><label>Dose<input data-k="dose" placeholder="1-0-1"></label><label>Days<input data-k="days" style="width:70px"></label><label>Note<input data-k="note"></label></div>`;
V.setup=async()=>{const [u,a]=await Promise.all([api('/users'),api('/audit?limit=40')]);const st=S.cfg.settings;
return `<div class="card"><h2>Doctors</h2><table><tr><th>Name</th><th>Department</th><th>Fee</th><th>Schedule</th></tr>${S.doctors.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.department)}</td><td>${money(d.fee_new)}</td><td>${d.schedules.map(s=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][s.weekday]+' '+s.start_time.slice(0,5)+'-'+s.end_time.slice(0,5)).join(', ')} <button class="b g s" data-act="addsch" data-id="${d.id}">Add schedule</button></td></tr>`).join('')}</table>
<form class="row" data-form="docadd"><label>Name<input name="name" required></label><label>Department<input name="department"></label><label>Qualification<input name="qualification"></label><label>New fee<input type="number" name="fee_new" value="0" min="0"></label><button class="b">Add doctor</button></form></div>
<div class="card"><h2>Tariff</h2><table><tr><th>Code</th><th>Service</th><th>Price</th></tr>${S.tariff.map(t=>`<tr><td>${esc(t.code)}</td><td>${esc(t.name)}</td><td>${money(t.price)}</td></tr>`).join('')}</table><form class="row" data-form="tfadd"><label>Code<input name="code" required style="width:90px"></label><label>Service<input name="name" required></label><label>Price<input type="number" name="price" min="0" step="0.01" required></label><label>GST %<input type="number" name="gst_pct" value="0" min="0" max="100" step="0.01" style="width:80px"></label><label>SAC<input name="sac_code" style="width:90px"></label><button class="b">Add</button></form></div>
<div class="card"><h2>Users</h2><table><tr><th>User</th><th>Role</th><th>Active</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.username)} <small>${esc(x.name)}</small></td><td>${esc(x.role)}</td><td>${x.active?'yes':'no'}</td><td><button class="b g s" data-act="toggle" data-id="${x.id}" data-a="${!x.active}">${x.active?'Disable':'Enable'}</button></td></tr>`).join('')}</table>
<form class="row" data-form="uadd"><label>Username<input name="username" required></label><label>Name<input name="name" required></label><label>Role<select name="role"><option>receptionist</option><option>doctor</option><option>billing</option><option>admin</option></select></label><label>Doctor profile (for doctors)<select name="doctor_id"><option value="">-</option>${S.doctors.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label><label>Password (8+)<input name="password" type="password" minlength="8" required></label><button class="b">Add user</button></form></div>
<div class="card"><h2>Audit log (latest 40)</h2><div class="sc"><table><tr><th>When</th><th>User</th><th>Action</th><th>Record</th></tr>${a.map(x=>`<tr><td>${esc(String(x.at).slice(0,19))}</td><td>${esc(x.username)}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td></tr>`).join('')}</table></div></div>`};
function printWin(html){const w=window.open('','_blank');if(!w){note('Allow pop-ups to print');return}w.document.write(`<!doctype html><title>Print</title><body style="font:14px system-ui;margin:24px">${html}<script>onload=()=>print()<\/script>`);w.document.close()}
const head=b=>`<div style="border-bottom:3px solid ${esc(b.primary)};padding-bottom:8px;margin-bottom:12px">${b.logo_url?`<img src="${esc(b.logo_url)}" style="height:44px;float:right">`:''}<h2 style="margin:0;color:${esc(b.primary)}">${esc(b.name)}</h2><div>${esc(b.address||'')} ${esc(b.phone||'')}</div></div>`;
const acts={
logout(){sessionStorage.clear();S.user=null;loginView()},nav(d){S.rx=null;go(d.v)},
pick(d){S.sel=d.id;S.selName=d.n;go(d.to)},
async history(d){const p=await api('/patients/'+d.id);q('#hist').innerHTML=`<div class="card"><h2>${esc(p.name)} (${esc(p.uhid)})</h2><h3>Prescriptions</h3>${p.prescriptions.map(r=>`<p>${esc(String(r.created_at).slice(0,10))} ${esc(r.diagnosis)}</p>`).join('')||'None'}<h3>Bills</h3>${p.bills.map(b=>`<p>${esc(b.bill_no)} ${money(b.total)} ${esc(b.status)}</p>`).join('')||'None'}</div>`},
async st(d){try{await api('/appointments/'+d.id,{method:'PATCH',body:{status:d.s}})}catch(e){note(e.message)}go('appt')},
async confirmreq(d){try{let p;try{p=await api('/patients',{method:'POST',body:{name:d.n,mobile:d.m}})}catch(e){if(e.status!==409)throw e;p=await api('/patients',{method:'POST',body:{name:d.n,mobile:d.m,force:true}})}
await api('/appointments/'+d.id,{method:'PATCH',body:{status:'booked',patient_id:p.id}});note('Confirmed and registered as '+p.uhid,true)}catch(e){note(e.message)}go('appt')},
rmline(d){S.lines.splice(+d.i,1);go('bill')},
async receipt(d){const b=await api('/bills/'+d.id);printWin(head(b.branding)+`<h3>Receipt ${esc(b.bill_no)}</h3><p>${esc(b.patient_name)} (${esc(b.uhid)})<br>${esc(String(b.created_at).slice(0,16).replace('T',' '))}</p><table width="100%" cellpadding="4">${b.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty} x ${money(i.price)}</td><td align="right">${money(i.amount)}</td></tr>`).join('')}</table><hr><p>Subtotal ${money(b.subtotal)}<br>Discount ${money(b.discount)}<br><b>Total ${money(b.total)}</b><br>Paid ${money(b.paid)} (${b.payments.map(p=>esc(p.mode)+' '+money(p.amount)).join(', ')})</p>`)},
consult(d){S.rx={a:d.id,p:d.p};go('doc')},rxback(){S.rx=null;go('doc')},addmed(){q('#meds').insertAdjacentHTML('beforeend',medRow())},
async printrx(d){const r=await api('/prescriptions/'+d.id);printWin(head(r.branding)+`<p><b>${esc(r.patient_name)}</b> (${esc(r.uhid)}) ${esc(r.gender)}<br>Dr ${esc(r.doctor_name)} ${esc(r.qualification)}</p><p><b>Complaints:</b> ${esc(r.complaints)}<br><b>Diagnosis:</b> ${esc(r.diagnosis)}</p><table width="100%" border="1" cellspacing="0" cellpadding="4"><tr><th>Medicine</th><th>Dose</th><th>Days</th><th>Note</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.dose)}</td><td>${esc(i.days)}</td><td>${esc(i.note)}</td></tr>`).join('')}</table><p><b>Advice:</b> ${esc(r.advice)}</p><p>${r.follow_up_date?'Follow-up: '+esc(r.follow_up_date):''}</p>`)},
async addsch(d){const day=prompt('Weekday number (0=Mon ... 6=Sun)');const s=prompt('Start time (HH:MM)','10:00'),e=prompt('End time (HH:MM)','13:00'),m=prompt('Slot minutes','15');if(day==null||!s||!e)return;

${isNurse()?`<form class="row" data-form="allergy"><label>Add allergy<input name="allergen" required></label><label>Reaction<input name="reaction"></label><button class="b g s">Add</button></form>`:''}
${isDr()&&S.user.role==='doctor'?`<form data-form="enc"><label>Complaints<input name="complaints" style="width:100%"></label><label>History<input name="history" style="width:100%"></label><label>Examination<input name="examination" style="width:100%"></label><div class="row"><label>Diagnosis code<input name="diagnosis_code" id="dxc" style="width:110px"></label><label>Diagnosis<input name="diagnosis_text" id="dxt" list="dxl"></label><datalist id="dxl"></datalist></div><label>Plan<input name="plan" style="width:100%"></label><input type="hidden" name="patient_id" value="${d.id}"><button class="b s">Save clinical note</button></form>`:''}
<table><tr><th>When</th><th>Type</th><th>Details</th></tr>${t.events.map(e=>`<tr><td>${esc(String(e.at).slice(0,16).replace('T',' '))}</td><td>${esc(e.type)}</td><td>${esc(e.title)}</td></tr>`).join('')}</table></div>`;
const dt=q('#dxt');if(dt)dt.oninput=async()=>{try{const r=await api('/diagnoses/search?q='+encodeURIComponent(dt.value));q('#dxl').innerHTML=r.map(x=>`<option value="${esc(x.name)}">${esc(x.code)}</option>`).join('');const m=r.find(x=>x.name===dt.value);if(m)q('#dxc').value=m.code}catch(e){}}}});
Object.assign(forms,{
async admit(f){if(!S.sel||!S.admBed){note('Select a patient and a bed first');return go('ipd')}try{const a=await api('/admissions',{method:'POST',body:{...fd(f),patient_id:S.sel,bed_id:S.admBed}});S.admBed=null;S.adm=a.id;note('Admitted '+a.adm_no,true)}catch(e){note(e.message)}go('ipd')},
async transfer(f){try{await api(`/admissions/${S.adm}/transfer`,{method:'POST',body:fd(f)});note('Bed changed',true)}catch(e){note(e.message)}go('ipd')},
async vitals(f){const v=nz(Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,x===''?'':Number(x)])));try{await api('/vitals',{method:'POST',body:{...v,patient_id:S.admPid||(await api('/admissions/'+S.adm)).patient_id,admission_id:S.adm}})}catch(e){note(e.message)}go('ipd')},
async nnote(f){try{await api(`/admissions/${S.adm}/nursing-notes`,{method:'POST',body:fd(f)})}catch(e){note(e.message)}go('ipd')},
async morder(f){try{await api(`/admissions/${S.adm}/med-orders`,{method:'POST',body:fd(f)})}catch(e){note(e.message)}go('ipd')},
async diet(f){try{await api(`/admissions/${S.adm}/diet`,{method:'POST',body:fd(f)})}catch(e){note(e.message)}go('ipd')},
async charge(f){const v=fd(f);try{await api(`/admissions/${S.adm}/charges`,{method:'POST',body:{tariff_id:v.tariff_id,qty:+v.qty||1}})}catch(e){note(e.message)}go('ipd')},
async ipay(f){const v=fd(f);try{const r=await api(`/admissions/${S.adm}/payments`,{method:'POST',body:{...v,amount:+v.amount}});note('Receipt '+r.receipt_no,true)}catch(e){note(e.message)}go('ipd')},
async discreq(f){const v=fd(f);try{await api(`/admissions/${S.adm}/discount-requests`,{method:'POST',body:{...v,amount:+v.amount}});note('Sent to admin for approval',true)}catch(e){note(e.message)}go('ipd')},
async billmk(f){const v=fd(f);try{const b=await api(`/admissions/${S.adm}/bills`,{method:'POST',body:{kind:v.kind,discount:+v.discount||0}});note('Bill '+b.bill_no+' generated',true)}catch(e){note(e.message)}go('ipd')},
async summary(f){try{await api(`/admissions/${S.adm}/discharge/summary`,{method:'POST',body:fd(f)});note('Summary saved',true)}catch(e){note(e.message)}go('ipd')},
async wardadd(f){const v=fd(f);try{await api('/wards',{method:'POST',body:{name:v.name,category:v.category||'general',daily_rate:+v.daily_rate,gst_pct:+v.gst_pct||0,beds:(v.beds||'').split(',').map(x=>x.trim()).filter(Boolean)}});note('Ward added',true)}catch(e){note(e.message)}go('setup')},
async pkgadd(f){const v=fd(f);try{await api('/packages',{method:'POST',body:{name:v.name,price:+v.price,gst_pct:+v.gst_pct||0,includes_room:v.includes_room==='true'}});note('Package added',true)}catch(e){note(e.message)}go('setup')},
async dximport(f){const rows=(fd(f).rows||'').split('\n').map(l=>l.split(',')).filter(p=>p.length>=2).map(p=>({code:p[0].trim(),name:p.slice(1).join(',').trim()}));try{const r=await api('/diagnoses/import',{method:'POST',body:rows});note(r.imported+' diagnoses imported',true)}catch(e){note(e.message)}go('setup')},
async allergy(f){try{await api(`/patients/${S.tlp}/allergies`,{method:'POST',body:fd(f)});note('Allergy added',true)}catch(e){note(e.message)}go('pat')},
async enc(f){try{await api('/encounters',{method:'POST',body:fd(f)});note('Clinical note saved',true)}catch(e){note(e.message)}go('pat')}});
boot();
</script></body></html>
