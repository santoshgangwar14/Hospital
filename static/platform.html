<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Console</title><style>
:root{--p:#1f3a5f;--s:#e9eef5;--ln:#d5dde3}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#f6f8fa;color:#1c2b33}
header{background:var(--p);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center}header h1{font-size:18px;margin:0;flex:1}main{max-width:1150px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}h2{margin:0 0 10px;font-size:17px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:#5b6b75;gap:3px}input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px}
button.b{background:var(--p);color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:#eef2f5;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln)}th{font-size:12px;color:#5b6b75}
.msg{padding:8px 12px;border-radius:8px;margin-bottom:10px;background:#fdecea;color:#c0392b}.msg.ok{background:#e6f4ec;color:#1a7f4b}.sc{overflow-x:auto}.tag{padding:2px 8px;border-radius:99px;background:var(--s);font-size:12px}
</style></head><body><header><h1>Hospital Platform Console</h1><button class="g" id="out" hidden>Log out</button></header><main id="m"></main><script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let msg='',ok=false;
async function api(p,o={}){const h={'Content-Type':'application/json'},k=sessionStorage.getItem('pt');if(k)h.Authorization='Bearer '+k;const r=await fetch('/api/platform'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});let j=null;try{j=await r.json()}catch(e){}
if(!r.ok){throw new Error(j&&j.detail?(Array.isArray(j.detail)?j.detail.map(x=>x.loc[x.loc.length-1]+': '+x.msg).join(', '):j.detail):r.statusText)}return j}
const fd=f=>Object.fromEntries([...new FormData(f)].filter(([k,v])=>v!==''));const flash=()=>msg?`<div class="msg ${ok?'ok':''}" role="alert">${esc(msg)}</div>`:'';
function loginV(){document.getElementById('out').hidden=true;m.innerHTML=`<div class="card" style="max-width:360px;margin:60px auto"><h2>Platform login</h2>${flash()}<form data-f="login"><label>Username<input name="username" required></label><br><label>Password<input name="password" type="password" required></label><br><button class="b">Log in</button></form></div>`}
async function home(){document.getElementById('out').hidden=false;try{const [t,pl]=await Promise.all([api('/tenants'),api('/plans')]);
m.innerHTML=flash()+`<div class="card"><h2>Hospitals (${t.length})</h2><div class="sc"><table><tr><th>Hospital</th><th>Plan</th><th>Status</th><th>Usage</th><th>Links</th><th>Actions</th></tr>${t.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.code)}</small></td><td><select data-a="plan" data-id="${x.id}">${pl.map(p=>`<option value="${p.code}" ${p.code===x.plan?'selected':''}>${esc(p.code)}</option>`).join('')}</select></td><td><span class="tag">${esc(x.status)}</span></td><td><small>${x.patients} patients, ${x.appointments} appts, ${x.bills} bills, ${x.users} users</small></td><td><a href="/site/${esc(x.code)}" target="_blank">Website</a> | <a href="/app/?t=${esc(x.code)}" target="_blank">Staff login</a> | <a href="/app/backoffice_login.html?t=${esc(x.code)}" target="_blank">Back office</a></td><td><button class="g" data-a="status" data-id="${x.id}" data-s="${x.status==='suspended'?'active':'suspended'}">${x.status==='suspended'?'Reactivate':'Suspend'}</button></td></tr>`).join('')}</table></div><p><button class="g" data-a="dispatch">Send all queued messages</button></p></div>
<div class="card"><h2>Onboard a new hospital</h2><form class="row" data-f="tenant"><label>Hospital name<input name="name" required></label><label>Code (a-z, 0-9, -)<input name="code" pattern="[a-z0-9-]{2,30}" required></label><label>Plan<select name="plan">${pl.map(p=>`<option value="${p.code}">${esc(p.name)}</option>`).join('')}</select></label><label>Primary colour<input name="primary" value="#0b6e99"></label><label>Secondary colour<input name="secondary" value="#e8f4f8"></label><label>Logo URL (https)<input name="logo_url"></label><label>Tagline<input name="tagline"></label><label>Phone<input name="phone"></label><label>Address<input name="address"></label><label>Patient ID prefix<input name="uhid_prefix" value="PT" pattern="[A-Z0-9]{1,6}"></label><label>Bill prefix<input name="bill_prefix" value="BL" pattern="[A-Z0-9]{1,6}"></label><label>Admin username<input name="admin_username" value="admin"></label><label>Admin password (8+)<input name="admin_password" type="password" minlength="8" required></label><button class="b">Create hospital</button></form></div>
<div class="card"><h2>Plans and modules</h2>${pl.map(p=>`<p><b>${esc(p.name)}</b>: ${p.modules.map(x=>`<span class="tag" style="${p.built.includes(x)?'':'opacity:.5'}">${esc(x)}${p.built.includes(x)?'':' (not built yet)'}</span>`).join(' ')}</p>`).join('')}</div>`}catch(e){msg=e.message;ok=false;sessionStorage.removeItem('pt');loginV()}msg=''}
const m=document.getElementById('m');
document.addEventListener('submit',async e=>{const n=e.target.dataset.f;if(!n)return;e.preventDefault();try{if(n==='login'){const r=await api('/login',{method:'POST',body:fd(e.target)});sessionStorage.setItem('pt',r.token);msg='';return home()}
if(n==='tenant'){const r=await api('/tenants',{method:'POST',body:fd(e.target)});msg='Created. Staff login: /app/?t='+r.code;ok=true;home()}}catch(x){msg=x.message;ok=false;sessionStorage.getItem('pt')?home():loginV()}});
document.addEventListener('change',async e=>{if(e.target.dataset.a==='plan'){try{await api('/tenants/'+e.target.dataset.id,{method:'PATCH',body:{plan:e.target.value}});msg='Plan updated. Modules change immediately.';ok=true}catch(x){msg=x.message;ok=false}home()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;try{if(b.dataset.a==='status'){await api('/tenants/'+b.dataset.id,{method:'PATCH',body:{status:b.dataset.s}});msg='Status updated';ok=true}
if(b.dataset.a==='dispatch'){const r=await api('/dispatch',{method:'POST'});msg=r.sent+' messages sent';ok=true}}catch(x){msg=x.message;ok=false}home()});
document.getElementById('out').onclick=()=>{sessionStorage.removeItem('pt');loginV()};
sessionStorage.getItem('pt')?home():loginV();
</script></body></html>
